typescript:
  coverage:
    threshold: 85
  complexity:
    max: 8
  dry:
    max_findings: 0
    paths:
      - .
    exclude:
      - "tests/**"
      - "scripts/**"
    copied_blocks:
      enabled: true
      min_tokens: 100
  mutation:
    targets:
      - src/core/config.ts
      - src/core/continuation.ts
      - src/core/reasoning.ts
      - src/core/run-history.ts
      - src/core/run-summary.ts
      - src/controller.ts
      - src/message.ts
      - src/options.ts
      - src/protocol.ts
  dependency_boundaries:
    - from: .
      allow: []
